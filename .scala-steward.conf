updates.pin = [
  # Scala 3.3 is the LTS release
  { groupId = "org.scala-lang", artifactId = "scala3-compiler", version = "3.3." }
  { groupId = "org.scala-lang", artifactId = "scala3-library", version = "3.3." }
  { groupId = "org.scala-lang", artifactId = "scala3-library_sjs1", version = "3.3." }
]

# Update related coordinates together across the root build and examples.
pullRequests.grouping = [
  { name = "zio", filter = [{ group = "dev.zio" }] }
  { name = "scalapb", filter = [{ group = "com.thesamet.scalapb" }] }
  { name = "grpc", filter = [{ group = "io.grpc" }] }
  { name = "scala", filter = [{ group = "org.scala-lang" }] }
  { name = "scalajs", filter = [{ group = "org.scala-js" }, { group = "org.portable-scala" }] }
  { name = "formatting", filter = [{ artifact = "sbt-scalafmt" }, { artifact = "scalafmt-core" }] }
]

buildRoots = [".", "examples/helloworld", "examples/routeguide", "examples/fullapp"]
