name: Release
# Called only after CI succeeds for the exact commit being published.
on:
  workflow_call:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: maven-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-build
      - name: Check publishing credentials
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          for name in SONATYPE_USERNAME SONATYPE_PASSWORD PGP_SECRET PGP_PASSPHRASE; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing $name"; exit 1; fi
          done
      - uses: olafurpg/setup-gpg@v3
      - name: Publish to Central Portal
        run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}

  docs:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: documentation-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-build
      - name: Generate documentation
        run: sbt docs/mdoc
      - name: Build website
        working-directory: website
        run: |
          yarn install --frozen-lockfile
          yarn build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy-docs:
    needs: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Check current master
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          if [[ "$current_sha" == "$GITHUB_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping documentation deployment for superseded master commit"
          fi
      - name: Deploy documentation
        if: steps.current.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
