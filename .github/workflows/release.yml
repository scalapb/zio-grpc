name: Release
# Called only after CI succeeds for the exact commit being published.
on:
  workflow_call:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: maven-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-build
      - name: Check publishing credentials
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          for name in SONATYPE_USERNAME SONATYPE_PASSWORD PGP_SECRET PGP_PASSPHRASE; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing $name"; exit 1; fi
          done
      - uses: olafurpg/setup-gpg@v3
      - name: Publish to Central Portal
        run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}

  docs:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: documentation-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-build
      - name: Generate documentation
        run: sbt docs/mdoc
      - name: Deploy documentation
        working-directory: website
        env:
          TOKEN: ${{ secrets.DEPLOY_KEY }}
          USE_SSH: 'true'
          GIT_USER: git
        run: |
          # A slower older CI run must not overwrite newer documentation.
          if [[ "$(git ls-remote origin refs/heads/master | cut -f1)" != "$GITHUB_SHA" ]]; then
            echo "Skipping documentation deployment for superseded master commit"
            exit 0
          fi
          git config --global user.name "ZIO-gRPC Docs"
          git config --global user.email "zio-grpc-docs@users.noreply.github.com"
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k' EXIT
          printf '%s\n' "$TOKEN" | ssh-add -
          yarn install --frozen-lockfile
          yarn deploy
