name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/')) }}
env:
  JVM_OPTS: -Xmx3G -XX:MaxDirectMemorySize=512m

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        scala: [2_12, 2_13, '3']
        java: ['11']
        include:
          - scala: '2_13'
            java: '21'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
        with:
          java: ${{ matrix.java }}
      - name: JVM and Scala.js tests
        run: sbt coreJVM${{ matrix.scala }}/test e2eJVM${{ matrix.scala }}/test coreJS${{ matrix.scala }}/test

  browser:
    strategy:
      fail-fast: false
      matrix:
        scala: [2_12, 2_13, '3']
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
      - name: Install matching Chromium and system libraries
        env:
          PLAYWRIGHT_INSTALL_DEPS: 'true'
        run: sbt e2eWebJVM${{ matrix.scala }}/installPlaywright
      - name: Browser integration tests
        run: |
          docker compose -f examples/fullapp/docker-compose.yaml up -d --wait
          sbt e2eWebJS${{ matrix.scala }}/fastOptJS/webpack e2eWebJVM${{ matrix.scala }}/test
      - name: Envoy logs
        if: failure()
        run: docker compose -f examples/fullapp/docker-compose.yaml logs
      - name: Clean up Envoy
        if: always()
        run: docker compose -f examples/fullapp/docker-compose.yaml down --volumes

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-build
      - name: Formatting and generated documentation
        run: sbt scalafmtCheckAll scalafmtSbtCheck docs/mdoc
      - name: Examples against this checkout
        run: .github/workflows/test_examples.sh
      - name: Website
        working-directory: website
        run: |
          yarn install --frozen-lockfile
          yarn build

  ci-passed:
    runs-on: ubuntu-24.04
    if: always()
    needs: [build, browser, checks]
    steps:
      - name: Require all checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'

  release:
    needs: ci-passed
    if: github.event_name == 'push' && github.repository == 'scalapb/zio-grpc' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/release.yml
    secrets: inherit
